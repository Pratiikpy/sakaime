# Spark settings for the Sakaime Zetaris stack. Replaces the vendor file, which is entirely commented out; heap and cores
# still come from ZSPARK_* in sakaime.env because the driver is launched with them on the command line.
#
# The silos hold hundreds of rows, so the cluster-sized shuffle default of 200 partitions only adds scheduling time.
spark.sql.shuffle.partitions        4
# Re-plan using observed sizes; leave on.
spark.sql.adaptive.enabled          true
